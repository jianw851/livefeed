apiVersion: apps/v1
kind: Deployment
metadata:
  name: livefeed-pricing-eurjpy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livefeed
  template:
    metadata:
      labels:
        app: livefeed
    spec:
      containers:
        - name: livefeed 
          image: liveget/livefeed_aarch64:0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 9092
          env:
            - name: FEED_NAME
              value: "OANDA-CURRENCY-PRICING-EUR_JPY"
            - name: ACCOUNT_ID
              value: "001-001-1638442-003"
            - name: TOKEN
              value: "78d5bef0a740e26c22be914c7d95b172-df4f81049d9996f71bbfc23924ad145e"
            - name: THRESHOLD
              value: "0.005"
            - name: BROKER_API_NAME
              value: "RestV20"
            - name: BROKER_ENV
              value: "prod"
            - name: GCP_APPLICATION_NAME
              value: "livefeed"
            - name: GCP_TOKENS_DIRECTORY_PATH
              value: "/opt/livefeed/tokens"
      imagePullSecrets:
        - name: regcred
